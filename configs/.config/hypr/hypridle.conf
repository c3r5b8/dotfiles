general {
    lock_cmd = gtklock -d                                # dbus/sysd lock command (loginctl lock-session)
    unlock_cmd = pkill -xu "$USER" -SIGUSR1 gtklock      # same as above, but unlock
    before_sleep_cmd = loginctl lock-session                        # command ran before sleep
    # after_sleep_cmd = notify-send "Awake!"  # command ran after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 45                            # in seconds
    on-timeout = chayang -d 45 && swaymsg "output * power off" # command to run when timeout has passed
    on-resume = swaymsg "output * power on"
}

listener {
    timeout = 120                            # in seconds
    on-timeout = loginctl lock-session # command to run when timeout has passed
    on-resume = swaymsg "output * power on"
}

listener {
    timeout = 300                            # in seconds
    on-timeout = bash -c 'if [ "$(cat /sys/class/power_supply/BAT0/status)" = "Discharging" ]; then systemctl suspend; fi' # command to run when timeout has passed
    on-resume = swaymsg "output * power on"
}
